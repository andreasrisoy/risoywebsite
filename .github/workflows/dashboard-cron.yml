name: Update Automated Dashboard

on:
  schedule:
    # Kjører hver 6. time (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # Tillater at du trykker på en knapp inne på GitHub for å tvinge en oppdatering
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run dashboard script
        run: python build_dashboard.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html
          git diff-index --quiet HEAD || git commit -m "Automated dashboard update [skip ci]"
          git push
