# Simple workflow for deploying static content to GitHub Pages
name: Update Automated Dashboard

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # Kjører hver 6. time (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  # Tillater at du trykker på en knapp inne på GitHub for å tvinge en oppdatering
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install yfinance

      - name: Run dashboard script
        run: python build_dashboard.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/index.html
          git diff-index --quiet HEAD || git commit -m "Automated dashboard update [skip ci]"
          git push

      # NYTT: Vi legger til utrullingen direkte her slik at siden faktisk oppdaterer seg live!
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Pakker ned hele repositoriet inkludert den nye dashboard-filen
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
