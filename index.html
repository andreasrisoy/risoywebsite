<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    
    <!-- Social Link Previews (Open Graph) -->
    <meta property="og:title" content="risoy.io">
    <meta property="og:description" content="Security & Privacy Research. Verified Identity.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://risoy.io">
    
    <title>risoy.io</title>

    <!-- Inline SVG Favicon (Shield Icon) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #d1d1d1;
            --accent: #00ff41; /* Terminal Green */
            --dim: #444;
        }

        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: "SF Mono", "Monaco", "Inconsolata", "Fira Mono", "Droid Sans Mono", monospace;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden; /* Forhindrer scroll-bars pga scanlines */
        }

        /* Scanline-effekt (CRT-følelse) */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 999;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        .card { 
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            border-left: 1px solid var(--dim);
            position: relative;
            z-index: 10;
        }

        h1 { 
            font-size: 1.5rem; 
            margin: 0 0 0.5rem 0; 
            letter-spacing: -1px;
            color: var(--accent);
            display: inline-block;
        }

        /* Blinkende markør */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.2em;
            background-color: var(--accent);
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            from, to { background-color: transparent; }
            50% { background-color: var(--accent); }
        }

        p { line-height: 1.6; margin: 0.8rem 0; }
        
        a { 
            color: var(--accent); 
            text-decoration: none; 
            border-bottom: 1px solid transparent;
            transition: all 0.2s ease;
        }

        a:hover { 
            border-bottom: 1px solid var(--accent);
            background: rgba(0, 255, 65, 0.1);
        }

        .verification {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--dim);
            font-size: 0.8rem;
            color: var(--dim);
        }

        .fingerprint {
            display: block;
            margin-top: 5px;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text);
            opacity: 0.6;
        }

        .dim-text { color: var(--dim); }

        /* Metadata linje nederst */
        .status-line {
            margin-top: 2rem;
            font-size: 0.65rem;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Mobile adjustments */
        @media (max-width: 480px) {
            .card { padding: 1.5rem; }
            h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <main class="card">
        <h1 id="typewriter"></h1><span class="cursor"></span>
        <p class="dim-text">Security & Privacy Research</p>
        
<p>
    Contact: <a href="mailto:secure@risoy.io">secure@risoy.io</a><br>
    Social: <a href="https://bsky.app/profile/risoy.io">Bluesky</a><br>
    Policy: <a href="/.well-known/security.txt">security.txt</a><br>
    vCard: <a href="/contact.vcf" download>Download Contact Card</a>
</p>

        <div class="verification">
            <span class="dim-text">PGP FINGERPRINT</span>
            <code class="fingerprint">
                E8C1 8510 D29B D842 D19D<br>
                95A4 EF2F BE81 B750 FA80
            </code>
        </div>
        
        <p class="dim-text" style="font-size: 0.7rem; margin-top: 2.5rem;">
            No tracking. No analytics. Identity verified via DNSSEC.
        </p>

        <div class="status-line" id="status-display">
            System: Online | Deployment: Fetching...
        </div>
    </main>

    <script>
        // 1. Skrive-effekt for overskrift
        const text = "risoy.io";
        let i = 0;
        function typeWriter() {
            if (i < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 150);
            }
        }

        // 2. Hente siste oppdatering fra GitHub
        async function fetchLastUpdate() {
            const user = "andreasrisoy"; // BYTT UT DENNE!
            const repo = "risoy-website";
            try {
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/commits/main`);
                const data = await response.json();
                const date = new Date(data.commit.author.date).toLocaleDateString('no-NO', { day: '2-digit', month: 'short' });
                document.getElementById("status-display").innerHTML = `System: Online | Last Patch: ${date}`;
            } catch (e) {
                document.getElementById("status-display").innerHTML = `System: Online | Mode: Stealth`;
            }
        }

        window.onload = () => {
            typeWriter();
            fetchLastUpdate();
        };
    </script>
</body>
</html>
